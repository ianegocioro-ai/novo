      ...(SCENARIO_CATEGORIES.find(c=>c.id===cat)||SCENARIO_CATEGORIES[0]).groups.map(g=>h('div',{key:g.id,className:'mb-6'},
        g.title&&h('h3',{className:'h3 mb-3'},g.icon+' '+g.title),
        h('div',{className:'option-grid'},
          ...SCENARIOS.filter(x=>x.group===g.id).map(s=>h('div',{key:s.id,className:'option-card '+(scenario===s.id?'selected':''),onClick:()=>setScenario(s.id)},
            h('div',{className:'option-emoji'},s.icon),
            h('div',{className:'option-name'},s.label),
            h('div',{className:'option-desc'},s.desc)
          ))
        )
      ))
    ),

    step===1&&h('div',null,
      h('h2',{className:'h2 mb-2'},'Perfil do cliente'),
      h('p',{className:'text-muted text-sm mb-4'},'Como o cliente virtual irá se comportar'),
      h('div',{className:'option-grid'},
        ...PROFILES.map(p=>h('div',{key:p.id,className:'option-card '+(profile===p.id?'selected':''),onClick:()=>setProfile(p.id)},
          h('div',{className:'option-emoji'},p.emoji),
          h('div',{className:'option-name'},p.label),
          h('div',{className:'option-desc mb-2'},p.desc),
          h('div',{style:{display:'flex',flexDirection:'column',gap:3}},
            h('div',{style:{display:'flex',alignItems:'center',gap:6}},
              h('span',{style:{fontSize:10,color:'var(--text-dim)',width:48}},'Paciência'),
              h('div',{className:'progress-outer',style:{height:4,flex:1}},
                h('div',{className:'progress-inner',style:{width:p.patience+'%',background:scoreColor(p.patience)}})
              )
            ),
            h('div',{style:{display:'flex',alignItems:'center',gap:6}},
              h('span',{style:{fontSize:10,color:'var(--text-dim)',width:48}},'Confiança'),
              h('div',{className:'progress-outer',style:{height:4,flex:1}},
                h('div',{className:'progress-inner',style:{width:p.trust+'%',background:scoreColor(p.trust)}})
              )
            )
          )
        ))
      )
    ),

    step===2&&h('div',null,
      h('h2',{className:'h2 mb-2'},'Nível de dificuldade'),
      h('p',{className:'text-muted text-sm mb-4'},'Quanto mais difícil, mais complexo e desafiador será o cliente'),
      h('div',{style:{display:'flex',flexDirection:'column',gap:12,maxWidth:480}},
        ...DIFFICULTIES.map(d=>h('div',{key:d.id,className:'option-card '+(diff===d.id?'selected':''),
          style:{display:'flex',alignItems:'center',gap:14},onClick:()=>setDiff(d.id)},
          h('div',{style:{width:14,height:14,borderRadius:'50%',background:d.color,flexShrink:0}}),
          h('div',null,
            h('div',{className:'option-name',style:{marginBottom:2}},d.label),
            h('div',{className:'option-desc'},d.desc)
          ),
          diff===d.id&&h('span',{style:{marginLeft:'auto',fontSize:18}},'✓')
        ))
      )
    ),

    step===3&&h('div',null,
      h('h2',{className:'h2 mb-4'},'Revisar configuração'),
      h('div',{className:'card mb-4',style:{maxWidth:480}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
          h('div',{className:'flex items-center justify-between'},
            h('span',{className:'text-muted text-sm'},'Cenário'),
            h('span',{style:{fontWeight:600}},S?.icon+' '+S?.label)
          ),
          h('hr',{style:{border:'none',borderTop:'1px solid var(--border)'}}),
          h('div',{className:'flex items-center justify-between'},
            h('span',{className:'text-muted text-sm'},'Perfil do cliente'),
            h('span',{style:{fontWeight:600}},P?.emoji+' '+P?.label)
          ),
          h('hr',{style:{border:'none',borderTop:'1px solid var(--border)'}}),
          h('div',{className:'flex items-center justify-between'},
            h('span',{className:'text-muted text-sm'},'Dificuldade'),
            h('span',{style:{fontWeight:600,color:D?.color}},D?.label)
          )
        )
      ),
      h('label',{className:'mb-4',style:{display:'flex',alignItems:'flex-start',gap:10,cursor:'pointer',padding:'10px 12px',border:'1px solid var(--border)',borderRadius:10}},
        h('input',{type:'checkbox',checked:waitEff,onChange:e=>setWaitOpen(e.target.checked),style:{marginTop:3}}),
        h('span',null,h('strong',null,'⏱ Aguardar 10 segundos para o operador abrir o atendimento'),h('br'),h('span',{className:'text-muted text-sm'},'Vale para usuários, gestores e lojistas. O cliente só começa a falar depois dos 10 segundos: use esse tempo para abrir o atendimento (cumprimentar e se identificar). Se ninguém abrir, ele diz "Alô? Tem alguém aí?".'))),
      S&&h('div',{className:'text-muted text-sm mb-4'},'🎭 Perfil da demanda (automático): '+demandLine(S)),
      h('details',{className:'mb-4'},h('summary',{style:{cursor:'pointer',fontWeight:600,marginBottom:10}},'🎙 Testar o microfone antes de iniciar'),h(MicTest,{})),
      h('div',{className:'alert alert-info mb-4'},
        '💡',h('span',null,S&&S.group!=='usuarios'?'Quando a simulação iniciar, peça CNPJ, razão social e o nome do responsável para confirmar a identificação antes de seguir com o atendimento.':'Quando a simulação iniciar, peça CPF, número do cartão ou nome ao cliente para confirmar a identidade antes de seguir com o atendimento.')
      )
    ),

    h('div',{className:'flex gap-3 mt-6'},
      step>0&&h('button',{className:'btn btn-ghost',onClick:prev},'← Anterior'),
      step<3
        ?h('button',{className:'btn btn-primary',onClick:next,disabled:!canNext[step]},'Próximo →')
        :h('button',{className:'btn btn-emerald btn-lg',onClick:start},'🚀 Iniciar simulação')
    )
  );
}

function SimulationRoom({config,onEnd}){
  const P=PROFILES.find(p=>p.id===config.profile);
  const S=SCENARIOS.find(s=>s.id===config.scenario);
  const D=DIFFICULTIES.find(d=>d.id===config.difficulty);
  const realClient=useMemo(()=>pickEntityForScenario(config.scenario),[]);
  const clientName=realClient.nome+(realClient.cnpj?' — '+realClient.razao:'');
  currentEntityName=realClient.cnpj?realClient.razao:null;
  useMemo(()=>{resetCallState();resetCardType();resetTitleholderStatus();currentProfileId=config.profile;setAutoVoice(realClient);},[]); // sorteia novo problema/estabelecimento/tipo de cartão/titularidade pra essa simulação

  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [speaking,setSpeaking]=useState(false);
  const [recording,setRecording]=useState(false);
  const [rage,setRage]=useState(config.difficulty==='hard'?85:config.difficulty==='medium'?60:35);
  const [elapsed,setElapsed]=useState(0);
  const [metrics,setMetrics]=useState({empathy:0,clarity:0,procedures:0,quality:0});
  const [voiceOn,setVoiceOn]=useState(true);
  const [interimText,setInterimText]=useState('');
  const [ending,setEnding]=useState(false);
  const [micMsg,setMicMsg]=useState('');
  const [handsFree,setHandsFree]=useState(false);
  const recRef=useRef(null);
  const transcriptRef=useRef('');
  const sentRef=useRef(false);
  const sendRef=useRef(null);
  const loadingRef=useRef(false);
  const silenceRef=useRef(null);
  const recordingRef=useRef(false);
  const handsFreeRef=useRef(false);
  const roomStartRef=useRef(Date.now());
  const firstOpRef=useRef(null);
  const chatRef=useRef(null);
  const timerRef=useRef(null);
  const msgCount=useRef(0);

  useEffect(()=>{timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);return()=>clearInterval(timerRef.current);},[]);

  useEffect(()=>{chatRef.current?.scrollTo({top:9999,behavior:'smooth'});},[messages,loading]);

  const addMsg=(role,content,via)=>{
    const m={id:Date.now()+'_'+Math.random(),role,content,ts:new Date(),via};
    setMessages(prev=>[...prev,m]);
    msgCount.current++;
    return m;
  };

  // contador de respostas boas/ruins do operador, usado pro fechamento e métricas
  const goodCount=useRef(0);
  const totalCount=useRef(0);
  const turnRef=useRef(0); // quantas vezes o cliente já falou (0=ainda não abriu)

  // Abertura da ligação: tenta IA real (se ativa); se falhar usa o banco local.
  // Com "aguardar o operador", o cliente espera 10 s: se o operador cumprimenta antes, o cliente responde;
  // se o tempo acaba, o cliente fala primeiro ("Alô? Tem alguém aí?").
  const openedRef=useRef(false);
  const openedByRef=useRef('operator');
  const openerRef=useRef(null);
  const [countdown,setCountdown]=useState(config.waitOpen?10:0);
  const deadlineRef=useRef(config.waitOpen?Date.now()+10000:0);
  const operatorSpokeRef=useRef(false);
  if(deadlineRef.current&&!speechNotBefore)speechNotBefore=deadlineRef.current;
  if(!config.waitOpen)speechNotBefore=0;
  const startOpener=(timedOut)=>{
    if(openedRef.current)return;
    openedRef.current=true;openedByRef.current=timedOut?'timeout':'operator';
    setCountdown(0);setLoading(true);setSpeaking(true);
    (async()=>{
      let opener=null;
      if(useAIBackend){
        try{
          const problemPair=getOrPickProblemPair();
          const cardPref=getOrPickCardType();
          const sysPrompt=buildSystemPrompt(P,S,D,realClient,problemPair,cardPref);
          opener=await callClaude(
            [{role:'user',content:`Inicie a ligação para o atendimento, explicando seu motivo de contato (${S?.label}) de forma natural e breve, conforme seu perfil comportamental.`}],
            sysPrompt,200
          );
        }catch(e){
          console.warn('IA indisponível, usando banco local:',e);
          opener=null;
        }
      }
      if(!opener)opener=buildOpener(P?.id,S?.id);
      if(timedOut)opener=pickRandom(['Alô? Tem alguém aí? ','Alô? Estou esperando há um tempo... ','Alô? '])+opener;
      setTimeout(()=>{
        addMsg('patient',opener);
        turnRef.current=1;
        if(voiceOn){speak(opener,rage,P);setTimeout(()=>setSpeaking(false),opener.length*60+500);}
        else setSpeaking(false);
        setLoading(false);
      },600); // pequeno delay simula "digitando"
    })();
  };
  openerRef.current=startOpener;
  useEffect(()=>{if(!config.waitOpen)startOpener(false);},[]);
  // Espera obrigatória: o prazo é medido por um horário absoluto (nunca antes de 10 s), mesmo que o operador cumprimente antes.
  useEffect(()=>{
    if(!config.waitOpen)return;
    const id=setInterval(()=>{
      const left=deadlineRef.current-Date.now();
      if(left<=0){clearInterval(id);setCountdown(0);openerRef.current(!operatorSpokeRef.current);}
      else setCountdown(Math.ceil(left/1000));
    },200);
    return()=>clearInterval(id);
  },[]);

  const sendMsg=useCallback((text,viaVoice)=>{
    const t=(text||input).trim();
    if(!t||loading)return;
    setInput('');setInterimText('');
    addMsg('operator',t,viaVoice?'voice':'text');
    if(firstOpRef.current===null)firstOpRef.current=Date.now()-roomStartRef.current;
    if(config.waitOpen&&!openedRef.current){ // o operador abriu o atendimento antes dos 10 s
      noteProtocol(t);totalCount.current+=1;if(scoreOperatorReply(t)>=0)goodCount.current+=1;
      operatorSpokeRef.current=true; // registra a abertura; o cliente só fala quando os 10 s terminarem
      return;
    }
    setLoading(true);setSpeaking(false);

    // avalia a resposta do operador com heurística local (sem IA)
    const heuristicScore=scoreOperatorReply(t);
    const isPositive=heuristicScore>=0;
    noteProtocol(t);
    const _prevCtx=_ctxKeys.slice();noteContext(t);
    if(/(vou (abrir|registrar|encaminhar|verificar|consultar|desbloquear|estornar|atualizar|gerar|solicitar)|desbloque|estorn|registr|encaminh|protocolo|segunda via|atualiz)/.test(normalizeText(t)))_opActions=true;
    if(isSecurityViolation(t))addMsg('debug','Alerta de segurança: o atendente pediu senha/CVV do cartão. Isso nunca deve ser solicitado ao cliente.');
    totalCount.current+=1;
    if(isPositive)goodCount.current+=1;

    // atualiza métricas com pequena variação aleatória pra parecer dinâmico
    const base=isPositive?65:40;
    const jitter=()=>Math.max(0,Math.min(100,base+Math.round((Math.random()*20)-10)));
    setMetrics(()=>({
      empathy:jitter(),
      clarity:jitter(),
      procedures:jitter(),
      quality:jitter()
    }));

    // A raiva agora reage de acordo com os parâmetros comportamentais do
    // perfil: erros pesam mais ou menos (errorReactionMultiplier) e boas
    // explicações calmam mais ou menos (goodExplanationBonus) dependendo de
    // quem é o cliente — um perfil "Difícil" reage muito mais a um erro do
    // que um perfil "Calmo", por exemplo.
    const errMult=P?.errorReactionMultiplier??1;
    const goodMult=P?.goodExplanationBonus??1;
    const rageChange=isPositive?(-8*goodMult):(6*errMult);
    setRage(r=>Math.max(0,Math.min(100,r+rageChange)));

    // O tempo de resposta do cliente reflete sua personalidade: perfis
    // apressados/irritados respondem quase na hora (interrompem), perfis
    // confusos/idosos demoram mais (processam a informação com calma).
    const [minDelay,maxDelay]=P?.responseDelay||[700,1200];
    const willInterrupt=Math.random()<(P?.interruptTendency??0.1);
    const responseDelay=willInterrupt
      ?minDelay*0.6 // interrupção: ainda mais rápido que o mínimo normal
      :minDelay+Math.random()*(maxDelay-minDelay);

    setTimeout(async()=>{
      // Tendência a repetir pergunta: se o perfil tem alta repeatTendency e
      // já estamos depois da 2ª fala, ele pode repetir uma pergunta de
      // acompanhamento já feita antes, simulando baixa retenção/ansiedade.
      const shouldRepeat=turnRef.current>2&&Math.random()<(P?.repeatTendency??0.1);

      let resp=null;
      let usedFallback=false;

      // Se a IA real está ativa, tenta gerar a resposta com ela primeiro —
      // ela já recebe todo o contexto comportamental através do system prompt.
      if(useAIBackend){
        try{
          const problemPair=getOrPickProblemPair();
          const cardPref=getOrPickCardType();
          const sysPrompt=buildSystemPrompt(P,S,D,realClient,problemPair,cardPref);
          const history=messages.filter(m=>m.role!=='debug').slice(-24).map(m=>({
            role:m.role==='patient'?'assistant':'user',
            content:m.content
          }));
          history.push({role:'user',content:t});
          resp=await callClaude(history,sysPrompt,200);
        }catch(e){
          console.warn('IA indisponível nesta resposta, usando banco local:',e);
          resp=null;
        }
      }

      // 1) Sem IA (ou IA falhou): tenta detectar um TÓPICO específico no que
      //    o operador escreveu (CPF, prazo, agendamento, documento, etc.).
      // 2) Se não detectar nenhum tópico, usa as perguntas de acompanhamento
      //    fixas (só nas primeiras 2 falas) ou a reação genérica por perfil.
      if(!resp){
        const topic=detectIntentReply(t);
        const _ph=profileBehaviorReply(P?.id,t,turnRef.current,realClient);
        const _long=longMessageReply(t,realClient,isPositive,_prevCtx);
        if(_ph){resp=_ph;}else if(_long){resp=_long;}else if(shouldRepeat&&!topic){
          const _fu=buildFollowUp(P?.id,S?.id,Math.random()<0.5?1:2);
          const _pre=pickRandom(['Desculpa, pode repetir? Eu perguntei: ','Não sei se ficou claro. ','Deixa eu perguntar de outro jeito: ']);
          resp=_pre+(/:\s$/.test(_pre)?_fu.charAt(0).toLowerCase()+_fu.slice(1):_cap(_fu));
        }else if(topic){
          resp=resolveIntentLine(topic,isPositive,realClient,t);
        }else if(turnRef.current===1){
          resp=buildFollowUp(P?.id,S?.id,1);
          usedFallback=true;
        }else if(turnRef.current===2){
          resp=buildFollowUp(P?.id,S?.id,2);
          usedFallback=true;
        }else{
          resp=buildPatientReply(P?.id,isPositive);
          usedFallback=true;
        }
        // Interrupção: corta a resposta, deixando mais seca/direta (sem a
        // segunda parte da frase, se houver vírgula ou ponto no meio).
        // IMPORTANTE: nunca corta respostas de tópicos onde o conteúdo
        // completo é essencial (identificação, problema, estabelecimento,
        // tipo de cartão) — cortar nome/CPF/número do cartão no meio deixaria
        // a resposta sem sentido e prejudicaria o treino do operador.
        const criticalTopics=['identification','problem','merchant','card_type'];
        const isCriticalTopic=topic&&criticalTopics.includes(topic.id);
        if(willInterrupt&&!isCriticalTopic&&resp.includes(', ')){
          resp=resp.split(', ')[0]+'...';
        }
        // Baixa confiança (trust): mesmo fora do tópico "desconfiado", perfis
        // com trust baixo ocasionalmente pedem confirmação ou protocolo extra.
        const trust=P?.trust??60;
        const lowTrustChance=(100-trust)/100*0.35;
        if(!willInterrupt&&!shouldRepeat&&Math.random()<lowTrustChance){
          resp+=' '+pickRandom([
            'Mas você pode me confirmar isso com certeza?',
            ...(protocolGiven()?[]:['Tem como anotar um protocolo dessa conversa?']),
            'Espero que essa informação esteja certa mesmo.',
          ]);
        }
      }

      // Nunca repetir exatamente uma fala que o cliente já disse nesta ligação (modo banco local).
      if(!useAIBackend&&resp){
        const prevP=messages.filter(m=>m.role==='patient').map(m=>m.content);
        let tries=0;
        while(prevP.includes(resp)&&tries<6){
          tries++;
          const tp=detectIntentReply(t);
          resp=(tp&&tries<4)?resolveIntentLine(tp,isPositive,realClient,t):buildPatientReply(P?.id,isPositive);
        }
        if(prevP.includes(resp))resp=pickRandom(['Como eu disse, ','Eu já mencionei, ','Repetindo, '])+resp.charAt(0).toLowerCase()+resp.slice(1);
      }

      turnRef.current+=1;
      if(usedFallback&&SHOW_UNMAPPED_DEBUG){
        addMsg('debug',`Tópico não mapeado para: "${t}" — o sistema usou uma resposta genérica de fallback. Pode reportar essa frase para mapear um novo comportamento.`);
      }
      addMsg('patient',resp);
      if(P?.id==='interrupter'&&Math.random()<0.65){const ex=pickRandom([['Alô?'],['Tá aí?','Responde logo, por favor.'],['E aí?']]);ex.forEach((x,i)=>setTimeout(()=>addMsg('patient',x),700+i*900+Math.random()*500));}
      setLoading(false);setSpeaking(true);
      if(voiceOn){speak(resp,rage,P);setTimeout(()=>setSpeaking(false),resp.length*55+400);}
      else setSpeaking(false);
    },responseDelay); // delay reflete a personalidade do perfil (responseDelay)
  },[input,loading,voiceOn,rage,P,S,D,realClient,messages]);

  sendRef.current=sendMsg;loadingRef.current=loading;recordingRef.current=recording;
  // ── Microfone ─────────────────────────────────────────────────────────────
  // Escuta contínua: espera pausas curtas (1,8 s) antes de enviar, junta frases ditas em partes, corrige
  // letra maiúscula/pontuação e, no modo "mãos livres", volta a ouvir sozinho depois que o cliente fala.
  const SILENCE_MS=1800;
  const finishVoice=()=>{
    clearTimeout(silenceRef.current);
    if(sentRef.current)return;
    sentRef.current=true;
    const t=polishSpeech(transcriptRef.current);
    transcriptRef.current='';
    setRecording(false);
    if(!t){setInterimText('');return;}
    if(loadingRef.current){setInput(t);setInterimText('');return;} // cliente ainda respondendo: fica como rascunho
    sendRef.current(t,true);
  };
  const startListening=()=>{
    if(recordingRef.current)return;
    setMicMsg('');stopSpeaking(); // para a voz do cliente para o microfone não captar o próprio áudio
    transcriptRef.current='';sentRef.current=false;
    try{if(navigator.permissions)navigator.permissions.query({name:'microphone'}).then(st=>{if(st.state==='denied')setMicMsg(micErrorMessage('not-allowed'));}).catch(()=>{});}catch(e){}
    const r=initSTT(
      (t)=>{transcriptRef.current=t;setInterimText(t);clearTimeout(silenceRef.current);silenceRef.current=setTimeout(()=>{try{r.stop();}catch(e){}},SILENCE_MS);},
      ()=>finishVoice(),
      (code)=>{
        const m=micErrorMessage(code);if(m)setMicMsg(m);
        if(code==='not-allowed'||code==='service-not-allowed'||code==='audio-capture'){setHandsFree(false);handsFreeRef.current=false;}
        if(code!=='aborted'&&code!=='no-speech'){transcriptRef.current='';setInterimText('');}
      },
      {continuous:true}
    );
    if(!r){setMicMsg(micErrorMessage('unsupported'));setHandsFree(false);handsFreeRef.current=false;return;}
    try{recRef.current=r;r.start();setRecording(true);recordingRef.current=true;}catch(e){setMicMsg(micErrorMessage('start-failed'));}
  };
  const toggleMic=()=>{
    if(recording){
      try{recRef.current?.stop();}catch(e){}
      setTimeout(finishVoice,1500); // segurança caso o navegador não avise o fim
      return;
    }
    startListening();
  };
  const toggleHands=()=>{
    const v=!handsFree;setHandsFree(v);handsFreeRef.current=v;
    if(!v&&recording){try{recRef.current?.stop();}catch(e){}}
  };
  // Mãos livres: depois que o cliente termina de falar (e não há resposta pendente), volta a ouvir sozinho.
  useEffect(()=>{
    if(!handsFree||recording||loading||speaking||ending)return;
    const id=setTimeout(()=>{if(handsFreeRef.current)startListening();},400);
    return()=>clearTimeout(id);
  },[handsFree,recording,loading,speaking,ending,countdown]);



  const endSim=async()=>{
    if(ending)return;
    setEnding(true);clearInterval(timerRef.current);stopSpeaking();
    const ratio=totalCount.current>0?goodCount.current/totalCount.current:0.5;
    const protoOk=protocolGiven();
    const closing=buildClosing(P?.id,ratio>=0.5)+((!protoOk&&(P?.trust??60)<=60)?' E, antes de desligar, eu não recebi nenhum número de protocolo.':'');
    const finalMessages=[...messages,{id:Date.now()+'_close',role:'patient',content:closing,ts:new Date()}];
    const ctx={messages:finalMessages,P,S,D,realClient,rage,protoOk,waitOpen:!!config.waitOpen,openedBy:openedByRef.current,elapsedSec:elapsed,openMs:firstOpRef.current};
    let rep;
    try{rep=anthropicApiKey?await evaluateWithAI(ctx):evaluateLocal(ctx);}
    catch(e){console.warn('Avaliação por IA falhou, usando a básica:',e);rep=evaluateLocal(ctx);rep.erroIA='(IA indisponível agora; usando a avaliação básica)';}
    onEnd({...config,messages:finalMessages,duration:fmtTime(elapsed),evaluation:buildEvalData(rep),clientName,realClient,P,S,D});
  };

  const rageColor=rage>70?'#ef4444':rage>40?'#facc15':'#22c55e';

  return h('div',{className:'sim-room'},
    ending&&h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',zIndex:60,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,textAlign:'center',padding:20}},'🧠 Analisando a conversa completa e gerando sua avaliação…'),
    // LEFT: patient stage + topbar

function clamp100(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v));}
function finalizeScores(n,f){

  const qual=(s.resolucao+s.procedimentos+s.clareza+s.empatia)/4;
  s.agilidade=Math.min(s.agilidade,Math.round(qual+10)); // rapidez nunca compensa atendimento ruim
  let t=0;for(const k in EVAL_WEIGHTS)t+=s[k]*EVAL_WEIGHTS[k];

}

  const avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;

}

  {id:'admin',icon:'⚙️',label:'Administração'},
];

// ── APP SHELL ─────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [simConfig,setSimConfig]=useState(null);
  const [simResult,setSimResult]=useState(null);
  const [theme,setTheme]=useState('dark');
  const [simState,setSimState]=useState('idle'); // idle | config | running | done

  useEffect(()=>{
    document.body.className=theme==='light'?'light':'';
  },[theme]);

  if(!user)return h(LoginPage,{onLogin:u=>{setUser(u);}});

  const startConfig=()=>{setSimState('config');setPage('simulation');};
  const startSim=(cfg)=>{setSimConfig(cfg);setSimState('running');};
  const endSim=(result)=>{setSimResult(result);setSimState('done');};
  const resetSim=()=>{setSimState('idle');setSimConfig(null);setSimResult(null);};

  const isSimRunning=page==='simulation'&&simState==='running';

  return h('div',{className:'app-shell'},
    // SIDEBAR
    h('aside',{className:'sidebar'},
      h('div',{className:'sidebar-logo'},
        h('div',{className:'logo-mark'},'🍽️'),
        h('div',null,
          h('div',{className:'logo-text'},'SimulaCard'),
          h('div',{className:'logo-sub'},'IA Platform')
        )
      ),
      h('div',{className:'sidebar-section'},'Menu'),
      ...NAV.map(n=>h('button',{key:n.id,className:'nav-item '+(page===n.id?'active':''),
        onClick:()=>{setPage(n.id);if(n.id!=='simulation')resetSim();}},
        h('span',{className:'nav-icon'},n.icon),
        h('span',null,n.label)
      )),
      h('div',{className:'sidebar-footer'},
        h('div',{className:'user-card'},
          h('div',{className:'user-avatar'},user.avatar||user.name.split(' ').map(n=>n[0]).join('').slice(0,2)),
          h('div',{className:'user-info'},
            h('div',{className:'user-name'},user.name),
            h('div',{className:'user-role'},user.role==='supervisor'?'Supervisor':'Operador')
          ),
          h('button',{className:'theme-btn',onClick:()=>setTheme(t=>t==='dark'?'light':'dark'),title:'Alternar tema'},
            theme==='dark'?'☀️':'🌙')
        )
      )
    ),
    // MAIN
    h('div',{className:'main-content'},
      !isSimRunning&&h('div',{className:'topbar'},
        h('span',{className:'topbar-title'},NAV.find(n=>n.id===page)?.icon+' '+NAV.find(n=>n.id===page)?.label),
        h('div',{className:'topbar-actions'},
          user.company&&h('span',{className:'chip'},user.company),
          h('button',{className:'btn btn-ghost btn-sm',onClick:()=>{setUser(null);resetSim();}},'Sair')
        )
      ),
      // PAGES
      page==='dashboard'&&h(Dashboard,{user,onNew:startConfig}),
      page==='simulation'&&simState==='idle'&&h('div',{className:'page'},
        h('div',{className:'empty'},
          h('div',{className:'empty-icon'},'🚀'),
          h('h2',{className:'h2 mb-2'},'Pronto para treinar?'),
          h('p',{className:'text-muted mb-4'},'Configure um cenário e comece a prática com seu cliente virtual.'),
          h('button',{className:'btn btn-primary btn-lg',onClick:startConfig},'Configurar simulação')
        )
      ),
      page==='simulation'&&simState==='config'&&h(SimulationConfig,{onStart:startSim,onBack:()=>{setSimState('idle');}}),
      page==='simulation'&&simState==='running'&&h(SimulationRoom,{config:simConfig,user,onEnd:endSim}),
      page==='simulation'&&simState==='done'&&h('div',{className:'main-content'},
        h('div',{className:'topbar'},
          h('span',{className:'topbar-title'},'🏆 Avaliação Final'),
          h('div',{className:'topbar-actions'},h('button',{className:'btn btn-ghost btn-sm',onClick:resetSim},'← Nova simulação'))
        ),
        h(EvaluationScreen,{result:simResult,onNew:()=>{resetSim();startConfig();},onHistory:()=>{resetSim();setPage('history');}})
      ),
      page==='history'&&h(HistoryPage,{onNew:startConfig}),
      page==='reports'&&h(ReportsPage,{}),
      page==='admin'&&h(AdminPage,{})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
